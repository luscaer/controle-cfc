services:
  db:
    image: postgres:16-alpine
    container_name: cfc_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - cfc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend/controle-cfc
    container_name: cfc_backend
    ports:
      - "${BACK_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # --- BANCO DE DADOS ---
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # --- JWT ---
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      APP_SECURITY_COOKIE_SECURE: "false" 

      # --- EMAIL ---
      SPRING_MAIL_HOST: sandbox.smtp.mailtrap.io
      SPRING_MAIL_PORT: 2525
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"

      # --- FRONTEND ---
      APP_URL_FRONTEND: ${FRONTEND_URL}

      # --- SUPER-ADMIN ---
      APP_SUPERADMIN_NAME: ${ADMIN_NAME}
      APP_SUPERADMIN_EMAIL: ${ADMIN_EMAIL}
      APP_SUPERADMIN_PASSWORD: ${ADMIN_PASS}
      APP_SUPERADMIN_PHONE: ${ADMIN_PHONE}
    networks:
      - cfc-network

  frontend:
    build:
      context: ./frontend
    container_name: cfc_frontend
    ports:
      - "${FRONT_PORT}:80"
    depends_on:
      - backend
    networks:
      - cfc-network

networks:
  cfc-network:
    driver: bridge

volumes:
  db_data: